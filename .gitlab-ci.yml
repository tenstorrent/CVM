include:
  - local: 'infra/container/gitlab-container.yml'
  - project: 'riscv/dv/gitlab-definitions'
    ref: main
    file: 'common-definitions.yml'

stages:
    - test
    - notify

test:
    stage: test
    extends:
        - .smoke-rules-all-branches-template
    script:
        - bazel --output_user_root=./bazel_output_user_root test //test/... --test_output=all
    after_script:
        - chmod +w -R ./bazel_output_user_root

notify_rv_tester:
    stage: notify
    extends:
        - .notify-template
    trigger:
        project: riscv/dv/rv_tester
