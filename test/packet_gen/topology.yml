common_attrs: &common_attrs
    ADDR_WIDTH: 52
    DATA_WIDTH: 256
    STRB_WIDTH: 32
    ID_WIDTH:   10
    NAME:       ""
    DOMAIN: 2
    CORE_CLUSTER_ATTR: "@TOP.CLUSTER.CLUSTER_ATTR"
axi_0: &axi_0
  <<: *common_attrs
  NAME: AXI0
  ID_WIDTH: 12

axi_1: &axi_1
  <<: *common_attrs
  NAME: AXI1
  ADDR_WIDTH: 64

axi_list: &axi_list [*axi_0, *axi_1]

top:
  cluster:
    count: 1
    type:
      - cluster
    core:
      count: 3
      type:
        - core
      y:
        count: 1
        type:
          - foo
      attrs:
        width: 2
        s: [1, 2, 3]
    z:
      count: 1
      type:
        - bar
    axi:
      type:
        - axi
      attrs: *axi_list
    attrs:
      AXI1_ID: "@TOP.CLUSTER.AXI[1].ID"
      CLUSTER_ATTR: 1000

