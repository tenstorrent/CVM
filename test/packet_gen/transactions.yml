dut:
  num: 1
  pkt:
      domain: 1
      num: 8
      fields:
          x54:
              width: ${TOP.CLUSTER.CORE.WIDTH * 27}
          x256:
              width: 256
          valid1:
              qualify: valid1
              width: 1
          optional1:
              qualify: valid1
              width: 8
          valid2:
              qualify: valid2
              width: 1
          optional2:
              qualify: valid2
              width: 8
          valid3a:
              qualify: "{data}.valid3a != '0 || {data}.valid3b != '0"
              width: 64
          valid3b:
              qualify: "{data}.valid3a != '0 || {data}.valid3b != '0"
              width: 64
          optional3:
              qualify: "{data}.valid3a != '0 || {data}.valid3b != '0"
              width: 512
          num:
              width: 3
          num1:
              width: [[2, 2, 4]] # 2x2 of width 4
          num2:
              width: [[3, 2, 5, 13]] # 3x2x5 of width 13

  never_seen:
      disabling_defines: ["DISABLE_NEVER_SEEN_PKT"]
      domain: 1
      fields:
          dummy:
            width: 32

  ctx:
      domain: 1
      context: true
      fields:
          dummy:
              width: 1

  zero:
      domain: 1
      fields:
          dummy:
              width: 0

  empty:
      domain: 1

dut2:
  num: [2, 1]
  pkt2:
      domain: [1, 1]
      fields:
          dummy2:
            widths: [2, 32]
          dummy3:
            widths: [${sum(TOP.CLUSTER.CORE.S)}, 45]

all_disabled:
    num: 1
    disabling_defines: ["DISABLE_NEVER_SEEN_PORT"]
    never_seen2:
        domain: 1
        fields:
            dummy:
                width: 32

__domains:
    1:
       dpi_init: "call_initialize_domain1"

__max_byte_transfer: 28
